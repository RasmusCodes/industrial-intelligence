# Company mapping database: which operational indicators drive which company, segment and line item.
#
# The links below were written before any model was estimated, from each company's own description of its
# business (see config/profiles/<TICKER>.yaml for the cited filing text) and the economic channel stated in
# config/indicators.yaml. Models use these links as given; nothing here was chosen by searching for fit.
#
# driver fields
#   indicator   id from config/indicators.yaml
#   role        demand  - volume of orders or sales
#               pricing - output price the company can charge
#               cost    - input cost that squeezes margins
#   segment     reportable segment the channel works through (display name), or "total"
#   lead        expected timing of the indicator relative to the company's reported revenue
#   why         the channel in one sentence
#
# segment_names maps XBRL segment members to display names (members renamed over time map to one name).

companies:

  - ticker: CAT
    sectors: [machinery, power]
    segment_names:
      ConstructionIndustriesMember: Construction Industries
      ResourceIndustriesMember: Resource Industries
      EnergyandTransportationMember: Power & Energy        # renamed from Energy & Transportation in 2025
      EnergyAndTransportationMember: Power & Energy
      PowerEnergyMember: Power & Energy
      FinancialProductsSegmentMember: Financial Products
      FinancialProductsMember: Financial Products
    drivers:
      - {indicator: m3_construction_mach_orders, role: demand, segment: Construction Industries, lead: coincident to 1 quarter, why: US industry orders for the machines Construction Industries sells through dealers.}
      - {indicator: cons_total, role: demand, segment: Construction Industries, lead: 0-2 quarters, why: Construction activity drives fleet utilisation and replacement.}
      - {indicator: cons_highway, role: demand, segment: Construction Industries, lead: 0-2 quarters, why: Road building is earthmoving-intensive.}
      - {indicator: housing_starts, role: demand, segment: Construction Industries, lead: 1-3 quarters, why: Residential starts buy compact and general construction equipment.}
      - {indicator: exp_construction_mach, role: demand, segment: Construction Industries, lead: coincident, why: Caterpillar is the largest US exporter of earthmoving machinery.}
      - {indicator: m3_mining_mach_orders, role: demand, segment: Resource Industries, lead: 0-2 quarters, why: US orders for mining and oilfield machinery.}
      - {indicator: ip_mining, role: demand, segment: Resource Industries, lead: 1-4 quarters, why: Mining output drives machine hours, parts and replacement.}
      - {indicator: copper_price, role: demand, segment: Resource Industries, lead: 2-4 quarters, why: Metal prices fund miners' equipment budgets.}
      - {indicator: ip_drilling, role: demand, segment: Power & Energy, lead: 0-2 quarters, why: Well-site engines, gas compression and turbines.}
      - {indicator: gen_pipeline_engines, role: demand, segment: Power & Energy, lead: 1-4 quarters, why: Reciprocating-engine power plants (Caterpillar gensets) planned on the grid.}
      - {indicator: gen_pipeline_gas, role: demand, segment: Power & Energy, lead: 1-4 quarters, why: Solar Turbines (Caterpillar) supplies industrial gas turbines.}
      - {indicator: hyperscaler_capex, role: demand, segment: Power & Energy, lead: 0-3 quarters, why: Data center backup and prime power (gensets, turbines).}
      - {indicator: ppi_construction_mach, role: pricing, segment: total, lead: coincident, why: Industry price index for construction machinery; Caterpillar reports price realization as a profit driver.}
      - {indicator: ppi_iron_steel, role: cost, segment: total, lead: 1-3 quarters, why: Steel is the main material cost.}

