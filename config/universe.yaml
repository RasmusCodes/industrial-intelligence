# Companies the platform covers.
#
# targets           companies whose fundamentals are modelled (SEC filers with quarterly XBRL)
# annual_only       SEC filers with annual XBRL only (foreign private issuers on Form 20-F)
# mapping_only      not SEC registrants: documented in the mapping database, no automated financials
# indicator_panels  companies whose own filings are used as operational indicators (customers' capex)
#
# sector keys: dc = data center infrastructure, grid = electrical equipment and grid, power = power generation,
# machinery = heavy machinery, construction = construction and engineering services, semicap = semiconductor
# equipment, automation = industrial automation.

